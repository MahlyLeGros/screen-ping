name: Tauri overlay prototype

on:
  push:
    paths:
      - "desktop-tauri/**"
      - ".github/workflows/tauri-proto.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build installer
        run: npx --yes @tauri-apps/cli@2 build
      - name: Sizes
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/*.exe, src-tauri/target/release/bundle/nsis/*.exe |
            ForEach-Object { "{0}  {1:N1} Mo" -f $_.Name, ($_.Length / 1MB) }
      - uses: actions/upload-artifact@v4
        with:
          name: screen-ping-tauri-proto
          path: |
            desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe
            desktop-tauri/src-tauri/target/release/screen-ping-tauri-proto.exe
