name: Screen Ping Desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "desktop-tauri/**"
      - "shared/**"
      - "deploy/desktop-feed/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "desktop-tauri/**"
      - "shared/**"
      - "deploy/desktop-feed/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  desktop-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-tauri/core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/core
      - run: cargo test

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build renderer
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npx vite build
      - name: Prepare renderer for Tauri
        working-directory: desktop-tauri
        run: node scripts/prepare-renderer.mjs
      - name: Build installer
        working-directory: desktop-tauri
        run: npx --yes @tauri-apps/cli@2 build
      - uses: actions/upload-artifact@v4
        with:
          name: screen-ping-tauri
          path: desktop-tauri/src-tauri/target/release/bundle/nsis/*-setup.exe
