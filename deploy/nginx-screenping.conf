# Example Nginx config for screenping.xyz
# Copy to /etc/nginx/sites-available/screenping on the VPS, then:
#   sudo ln -sf /etc/nginx/sites-available/screenping /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT: default nginx client_max_body_size is 1MB — uploads fail with
# "Request Entity Too Large" unless you raise it (see below).

map $sent_http_content_type $csp_header {
    default "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' wss://screenping.xyz https://screenping.xyz https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com; frame-src https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'";
}

server {
    listen 80;
    server_name screenping.xyz www.screenping.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name screenping.xyz www.screenping.xyz;

    # Allow uploads up to app limits (50MB video + optional sound file).
    client_max_body_size 60M;

    ssl_certificate /etc/letsencrypt/live/screenping.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/screenping.xyz/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $csp_header always;

    # Static web app — keep this outside the SSH home directory (www-data cannot read home dirs)
    root /var/www/screenping;
    index index.html;

    # API + Socket.IO + uploads — MUST proxy POST (not try_files) or uploads return 405
    location /api/ {
        client_max_body_size 60M;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Desktop auto-update feed (latest.yml + installer)
    location /desktop/updates/ {
        alias /var/www/screenping/desktop/updates/;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp_header always;
    }

    # SPA — keep last so /api/ and /uploads/ are not caught by try_files
    location / {
        try_files $uri $uri/ /index.html;
    }
}
