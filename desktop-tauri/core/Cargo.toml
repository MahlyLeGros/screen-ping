[package]
name = "screenping-core"
version = "0.1.0"
edition = "2021"
description = "Screen Ping desktop receiver core (no UI): session, API, socket, overlay queue"
publish = false

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
ed25519-dalek = "2"
futures-util = "0.3.34"
log = "0.4.35"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "native-tls", "query", "http2"] }
rust_socketio = { version = "0.6", features = ["async"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.54.1", features = ["full"] }
uuid = { version = "1.29.3", features = ["v4"] }
