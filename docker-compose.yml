services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: screenping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: screenping
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screenping -d screenping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql://screenping:${POSTGRES_PASSWORD}@db:5432/screenping
      CORS_ORIGINS: http://localhost:5173,http://localhost,https://screenping.xyz,https://www.screenping.xyz
      SERVE_SPA: "false"
      ENABLE_API_DOCS: "false"
    volumes:
      - ./server:/app
      # Host folder survives container recreate / `docker compose down -v`.
      - ./data/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
