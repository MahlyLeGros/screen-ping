services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: screenping
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: screenping
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screenping -d screenping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql://screenping:${POSTGRES_PASSWORD}@db:5432/screenping
      CORS_ORIGINS: http://localhost:5173,http://localhost,https://screenping.xyz,https://www.screenping.xyz
      SERVE_SPA: "false"
      ENABLE_API_DOCS: "false"
      REDIS_URL: redis://redis:6379/0
      TIKTOK_IMPORT_ENABLED: ${TIKTOK_IMPORT_ENABLED:-false}
      YOUTUBE_IMPORT_ENABLED: ${YOUTUBE_IMPORT_ENABLED:-false}
      INSTAGRAM_IMPORT_ENABLED: ${INSTAGRAM_IMPORT_ENABLED:-false}
      VIDEO_CLIP_ENABLED: ${VIDEO_CLIP_ENABLED:-false}
    volumes:
      - ./server:/app
      # Host folder survives container recreate / `docker compose down -v`.
      - ./data/uploads:/app/uploads
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

  import-worker:
    build: ./server
    command: ["python", "clip_worker.py"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://screenping:${POSTGRES_PASSWORD}@db:5432/screenping
      TIKTOK_IMPORT_ENABLED: ${TIKTOK_IMPORT_ENABLED:-false}
      YOUTUBE_IMPORT_ENABLED: ${YOUTUBE_IMPORT_ENABLED:-false}
      INSTAGRAM_IMPORT_ENABLED: ${INSTAGRAM_IMPORT_ENABLED:-false}
      VIDEO_CLIP_ENABLED: ${VIDEO_CLIP_ENABLED:-false}
    volumes:
      - ./data/uploads:/app/uploads
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
